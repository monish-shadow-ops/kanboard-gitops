{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "kanboard.labels" . | nindent 4 }}
  {{- if .Values.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer | quote }}
  {{- end }}

spec:
  gatewayClassName: {{ .Values.gateway.className }}

  listeners:
    - name: http
      hostname: {{ .Values.httpRoute.hostname | quote }}
      protocol: HTTP
      port: 80

      allowedRoutes:
        namespaces:
          from: Same

    {{- if .Values.tls.enabled }}
    - name: https
      hostname: {{ .Values.httpRoute.hostname | quote }}
      protocol: HTTPS
      port: 443

      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.tls.secretName }}

      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: allowed
    {{- end }}
{{- end }}
