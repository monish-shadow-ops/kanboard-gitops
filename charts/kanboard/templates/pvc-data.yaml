{{- if .Values.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: {{ required "persistence.data.claimName is required" .Values.persistence.data.claimName }}

  labels:
    {{- include "kanboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-storage

spec:
  accessModes:
    {{- toYaml .Values.persistence.data.accessModes | nindent 4 }}

  storageClassName: {{ required "persistence.data.storageClass is required" .Values.persistence.data.storageClass | quote }}

  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
{{- end }}
