apiVersion: v1
kind: Service

metadata:
  name: {{ include "kanboard.fullname" . }}

  labels:
    {{- include "kanboard.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

  selector:
    {{- include "kanboard.selectorLabels" . | nindent 4 }}
