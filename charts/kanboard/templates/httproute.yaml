{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: {{ include "kanboard.fullname" . }}-route
  labels:
    {{- include "kanboard.labels" . | nindent 4 }}

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: {{ ternary "https" "http" .Values.tls.enabled }}

  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "kanboard.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
