{{- if and .Values.gateway.enabled .Values.tls.enabled .Values.tls.redirectHTTPToHTTPS }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: {{ include "kanboard.fullname" . }}-http-redirect
  labels:
    {{- include "kanboard.labels" . | nindent 4 }}

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: http

  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}

  rules:
    - filters:
        - type: RequestRedirect

          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
