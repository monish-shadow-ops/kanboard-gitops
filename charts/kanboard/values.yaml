# Optional overrides for Kubernetes resource names.
nameOverride: ""
fullnameOverride: ""

# Kanboard uses persistent ReadWriteOnce volumes,
# so we begin with one application replica.
replicaCount: 1

image:
  repository: monishs2722/kanboard-cicd

  # The production SHA tag will be supplied using
  # values-production.yaml or Argo CD.
  tag: ""

  pullPolicy: IfNotPresent

application:
  debug: "false"

  # Keep web-based plugin installation disabled.
  pluginInstaller: "false"

service:
  type: ClusterIP
  port: 80
  targetPort: http

resources:
  requests:
    cpu: 200m
    memory: 256Mi

  limits:
    cpu: "1"
    memory: 1Gi

persistence:
  storageClassName: gp3-encrypted-retain

  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi

  plugins:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi

postgres:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  database: kanboard
  username: kanboard

  # This Secret will be created later by External Secrets
  # or manually for initial testing.
  existingSecret: postgres-secret
  databaseUrlKey: database-url

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi

    limits:
      cpu: "1"
      memory: 1Gi

gateway:
  enabled: true
  className: eg
  name: kanboard-gateway

  listener:
    name: http
    protocol: HTTP
    port: 80

httpRoute:
  enabled: true
  hostname: monish.kubeace.in
